# 通过 npmjs Trusted Publishing (GitHub Actions OIDC) 发布 / Publish via npmjs Trusted Publishing
# npmjs 侧需先配置 trusted publisher（见 README 或 docs.npmjs.com/trusted-publishers）
# 触发 / Triggers: push tag v* 或手动 workflow_dispatch
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # OIDC —— Trusted Publishing 必需，不依赖 npm token
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # npm 12+ 才有 OIDC 发布认证（trusted publishing）；node 24 自带 npm 11，
      # 需显式升级 npm 12（engines: node ^22.22.2 || ^24.15.0）。
      # npm 12+ is required for OIDC publish auth (trusted publishing); node 24
      # ships npm 11, so upgrade to npm 12 explicitly.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Upgrade npm (OIDC support)
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # 关键：setup-node 写入的 .npmrc 含 "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"，
      # 这会让 npm 永远走 token 认证（空/无效 -> 404/ENEEDAUTH），不会走 OIDC。
      # 发布前删除 .npmrc 并 unset 相关变量，npm 才会执行 OIDC trusted publishing。
      # Root cause: setup-node writes an .npmrc with an _authToken line, so npm
      # always uses token auth instead of OIDC. Remove .npmrc and unset env so
      # npm performs the OIDC exchange (trusted publishing).
      - name: Publish to npmjs (Trusted Publishing + provenance)
        run: |
          rm -f "$NPM_CONFIG_USERCONFIG" "$HOME/.npmrc"
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          npm publish --provenance --access public
