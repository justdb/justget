# 通过 npmjs Trusted Publishing (GitHub Actions OIDC) 发布 / Publish via npmjs Trusted Publishing
# npmjs 侧需先配置 trusted publisher（见 README 或 docs.npmjs.com/trusted-publishers）
# 触发 / Triggers: push tag v* 或手动 workflow_dispatch
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write # OIDC —— Trusted Publishing 必需，不依赖 npm token
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # 必须清空 NODE_AUTH_TOKEN：存在时 npm 会走 token 认证而非 OIDC，
      # 导致 trusted publishing 失败（404 PUT）。
      # MUST clear NODE_AUTH_TOKEN: if present, npm uses token auth instead of
      # OIDC and trusted publishing fails with 404 PUT.
      - name: Publish to npmjs (Trusted Publishing + provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ''
