# 临时诊断：查看 OIDC claims 与 npmjs 授权响应（验证后删除）
name: debug-oidc

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Inspect OIDC exchange
        run: |
          echo "npm version: $(npm --version)"
          echo "OIDC URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "NODE_AUTH_TOKEN set: ${NODE_AUTH_TOKEN:+yes} len=${#NODE_AUTH_TOKEN}"
          ID_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm")
          PAYLOAD=$(echo "$ID_TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null)
          echo "=== OIDC claims ==="
          echo "$PAYLOAD" | python3 -m json.tool 2>/dev/null | grep -E '"workflow"|"repository"|"repository_owner"|"ref"|"job_workflow_ref"|"environment"'
          echo "=== oidc-exchange response ==="
          RESP=$(curl -sS -X POST https://registry.npmjs.org/-/npm/v1/oidc-exchange \
            -H "content-type: application/json" \
            -d "{\"oidc_id_token\":\"$ID_TOKEN\",\"name\":\"publish\"}")
          echo "$RESP" | head -c 600
          echo ""
