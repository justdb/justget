# 临时诊断 2：检查 npm 配置 + 直接测试 npmjs OIDC exchange（验证后删除）
name: debug-oidc2

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Inspect npm config & OIDC exchange
        run: |
          set +e
          echo "NPM_CONFIG_USERCONFIG=$NPM_CONFIG_USERCONFIG"
          echo "--- .npmrc content ---"
          cat "$NPM_CONFIG_USERCONFIG" 2>/dev/null
          echo "--- npm config ---"
          npm config get registry
          echo "--- OIDC env ---"
          echo "URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          # 1) 获取 GitHub OIDC token (audience=npm)
          ID_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm")
          echo "id_token len: ${#ID_TOKEN}"
          echo "--- OIDC claims ---"
          echo "$ID_TOKEN" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); [print(k,'=',d.get(k)) for k in ['iss','sub','repository','repository_owner','workflow','workflow_ref','job_workflow_ref','ref','environment','aud']]"
          # 2) 直接测 npmjs oidc-exchange
          echo "--- oidc-exchange (name=publish) ---"
          RESP=$(curl -sS -w "\nHTTP:%{http_code}" -X POST https://registry.npmjs.org/-/npm/v1/oidc-exchange \
            -H "content-type: application/json" \
            -d "{\"oidc_id_token\":\"$ID_TOKEN\",\"name\":\"publish\"}")
          echo "$RESP" | head -c 800
          echo ""
